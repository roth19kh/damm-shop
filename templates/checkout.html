{% extends "master.html" %}
{% block content %}

<div class="container my-5">
    <h2 class="text-center mb-4">Checkout</h2>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card checkout-card p-4">
                <!-- Order Summary -->
                <h5 class="mb-3">Order Summary</h5>
                <div class="card mb-4">
                    <div class="card-body" id="cartSummary">
                        <!-- Cart items will be displayed here -->
                    </div>
                </div>

                <form id="checkoutForm" method="POST">
                    <!-- Customer Info -->
                    <h5 class="mb-3">Customer Information</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" placeholder="Your Full Name" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" placeholder="you@example.com" name="email"
                                   required>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="mb-3">
                        <label class="form-label">Address *</label>
                        <input type="text" class="form-control" placeholder="123 Main Street" name="address" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">City *</label>
                            <input type="text" class="form-control" placeholder="Phnom Penh" name="city" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Country *</label>
                            <input type="text" class="form-control" placeholder="Cambodia" name="country" required>
                        </div>
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" class="form-control" placeholder="+855 12 345 678" name="phone" required>
                    </div>

                    <!-- Hidden fields for cart data -->
                    <input type="hidden" name="cart_data" id="cartData">
                    <input type="hidden" name="shipping_fee" value="0">
                    <input type="hidden" name="total" id="totalAmount">

                    <!-- Payment -->
                    <h5 class="mb-3">Payment Method</h5>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="payment" id="creditCard"
                               value="Credit/Debit Card" checked>
                        <label class="form-check-label" for="creditCard">
                            Credit/Debit Card
                        </label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="payment" id="paypal" value="Paypal">
                        <label class="form-check-label" for="paypal">
                            PayPal
                        </label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="radio" name="payment" id="cod" value="Cash on Delivery">
                        <label class="form-check-label" for="cod">
                            Cash on Delivery
                        </label>
                    </div>

                    <!-- Submit -->
                    <div class="text-end">
                        <button type="submit" id="checkout-btn" class="btn btn-success rounded-pill px-4 py-2">
                            Place Order
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
    document.getElementById('checkoutForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const submitBtn = document.getElementById('checkout-btn');
        const originalText = submitBtn.innerHTML;

        // Show loading state
        submitBtn.innerHTML = '⏳ Placing Order...';
        submitBtn.disabled = true;

        try {
            // Prepare form data
            const formData = new FormData(this);
            const formObject = {
                name: formData.get('name'),
                email: formData.get('email'),
                address: formData.get('address'),
                city: formData.get('city'),
                country: formData.get('country'),
                phone: formData.get('phone'),
                payment: formData.get('payment'),
                shipping_fee: parseFloat(formData.get('shipping_fee')),
                total: parseFloat(formData.get('total')),
                cart: JSON.parse(formData.get('cart_data'))
            };

            console.log('📦 Sending order data:', formObject);

            // Step 1: Test basic POST request
            console.log("🔍 Step 1: Testing basic POST...");
            const testResponse = await fetch('/test-post', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({test: "hello"})
            });

            const testResult = await testResponse.json();
            console.log("✅ Test POST result:", testResult);

            if (!testResponse.ok) {
                throw new Error('Basic POST test failed: ' + testResult.error);
            }

            // Step 2: Test with actual order data
            console.log("🔍 Step 2: Testing with order data...");
            const testOrderResponse = await fetch('/test-post', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formObject)
            });

            const testOrderResult = await testOrderResponse.json();
            console.log("✅ Test order POST result:", testOrderResult);

            if (!testOrderResponse.ok) {
                throw new Error('Order data test failed: ' + testOrderResult.error);
            }

            // Step 3: Try the actual placeOrder endpoint
            console.log("🔍 Step 3: Trying actual placeOrder...");
            const response = await fetch('/placeOrder', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formObject)
            });

            console.log("📊 Response status:", response.status);
            console.log("📊 Response status text:", response.statusText);

            // Handle response
            if (response.ok) {
                const result = await response.json();
                console.log("✅ Success:", result);
                alert('✅ ' + result.message);
                // Clear cart and redirect
                localStorage.removeItem('cart');
                window.location.href = '/';
            } else {
                // Try to get error message
                try {
                    const errorResult = await response.json();
                    console.error("❌ Error response:", errorResult);
                    alert('❌ Error: ' + errorResult.error);
                } catch (jsonError) {
                    // If response is not JSON, get text
                    const errorText = await response.text();
                    console.error("❌ Non-JSON error:", errorText);

                    if (response.status === 401) {
                        alert('🔐 Please login again to place an order.');
                        window.location.href = '/login';
                    } else if (response.status === 500) {
                        alert('🚨 Server error. Please try again later.');
                    } else {
                        alert('❌ Error: ' + response.status + ' - ' + errorText.substring(0, 100));
                    }
                }
            }

        } catch (error) {
            console.error('💥 Network error:', error);
            alert('🌐 Network error: ' + error.message);
        } finally {
            // Restore button state
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
</script>

<style>
    .checkout-card {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }

    .btn:disabled {
        cursor: not-allowed;
        opacity: 0.6;
    }
</style>
{% endblock %}
